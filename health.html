<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Rig Health</title>
<style>
:root{--bg:#0e0b14;--card:#1a1524;--text:#efe9f7;--muted:#9a8fae;--ok:#3ddc84;--idle:#6b6478;--warn:#ffb020;--down:#ff4d5e;--accent:#a36bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,system-ui,sans-serif;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.sum{display:flex;gap:8px;margin:0 0 14px}.pill{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.pill b{display:block;font-size:22px;color:var(--text)}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}
.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.idle .dot{background:var(--idle)}
.warn .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}.down .dot{background:var(--down);box-shadow:0 0 8px var(--down)}
.name{font-weight:600}.detail{color:var(--muted);font-size:13px;word-break:break-word}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
button{background:var(--card);color:var(--text);border:1px solid #2c2440;border-radius:12px;padding:14px 6px;font:600 14px -apple-system,system-ui;}
button:active{background:var(--accent)}.msg{color:var(--muted);font-size:13px;min-height:18px;text-align:center}
</style></head><body>
<h1>Rig Health</h1><div class="sub" id="sub">checking…</div>
<div class="sum"><div class="pill"><b id="nok">–</b>OK</div><div class="pill"><b id="nidle">–</b>Idle</div><div class="pill"><b id="nbad">–</b>Problems</div></div>
<div id="list"></div>
<div class="btns">
<button data-look="purple">Purple</button><button data-look="rainbow">Rainbow</button><button data-look="showsafe">Safe show</button>
<button data-look="movienight">Movie</button><button data-look="purplenight">Night (purple)</button><button data-look="off">Lights off</button>
<button data-look="guest_on" style="grid-column:span 3" id="guestbtn">Guest mode: block strobes</button>
</div><div class="msg" id="msg"></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  try{
    const r=await fetch('/health.json',{cache:'no-store'});
    if(!r.ok){document.getElementById('sub').textContent='Not allowed — open this page from the link with the key once.';return}
    const d=await r.json(),c=d.checks||[];
    document.getElementById('list').innerHTML=c.map(x=>`<div class="row ${esc(x.level)}"><div class="dot"></div><div><div class="name">${esc(x.name)}</div><div class="detail">${esc(x.detail)}</div></div></div>`).join('');
    const n=l=>c.filter(x=>x.level===l).length;
    document.getElementById('nok').textContent=n('ok');document.getElementById('nidle').textContent=n('idle');
    document.getElementById('nbad').textContent=n('warn')+n('down');
    document.getElementById('sub').textContent='Checked '+(d.at||'?')+' · refreshes every 5 s';
    const g=c.find(x=>x.name==='Guest mode'),gb=document.getElementById('guestbtn');
    if(g&&gb){const on=g.detail.startsWith('ON');gb.dataset.look=on?'guest_off':'guest_on';
      gb.textContent=on?'Guest mode is ON — tap to allow strobes again':'Guest mode: block strobes';
      gb.style.borderColor=on?'var(--ok)':'#2c2440'}
  }catch(e){document.getElementById('sub').textContent='Can’t reach the Mac — is it awake and on home Wi-Fi?'}
}
document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
  const m=document.getElementById('msg');m.textContent='…';
  try{const r=await fetch('/'+b.dataset.look,{cache:'no-store'});m.textContent=await r.text()}catch(e){m.textContent='Couldn’t reach the rig.'}
  setTimeout(load,1500)});
load();setInterval(load,5000);
</script></body></html>
